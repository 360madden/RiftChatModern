name: RCM offline regression

# This is a disposable Windows fixture runner, not a live-game test host.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'recovery/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rcm-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-offline:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: RiftChatModern
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: RiftChatModern
          persist-credentials: false
      - name: Check out pinned observer decoder
        uses: actions/checkout@v4
        with:
          repository: 360madden/LuaPadModern
          ref: 9c65386489f8d1e4c8d81b9ed01c6c22b98e4ecc
          path: LuaPadModern
          sparse-checkout: tools/rift-log-probe.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned fixture dependencies
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Build and qualify offline suites
        shell: pwsh
        run: python -B tools/rcm_offline_ci.py
      - name: Build and verify addon-only candidate
        shell: pwsh
        run: |
          python -B tools/package_rcm.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/package_rcm.py --check
      - name: Retain qualified addon candidate
        uses: actions/upload-artifact@v4
        with:
          name: rcm-addon-candidate-${{ github.sha }}
          path: |
            RiftChatModern/dist/RiftChatModern-*.zip
            RiftChatModern/dist/RiftChatModern-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
