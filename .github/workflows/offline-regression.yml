name: RCM offline regression

# This is a disposable Windows fixture runner, not a live-game test host.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'recovery/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rcm-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-offline:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned fixture dependencies
        shell: pwsh
        run: python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Build and qualify offline suites
        shell: pwsh
        run: python -B tools/rcm_offline_ci.py
